name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.5.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm run type:check

      - name: Check acceptance host types
        run: pnpm run acceptance:typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Build library
        run: pnpm run build

      - name: Build acceptance host
        run: pnpm run acceptance:build

      - name: Check package contents
        run: pnpm run pack:check

      - name: Verify real tarball in an isolated consumer
        run: pnpm run verify:tarball
