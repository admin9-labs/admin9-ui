name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.5.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm@10.5.2 install --frozen-lockfile

      - name: Verify repository toolchain
        run: |
          node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          test "$(corepack pnpm@10.5.2 --version)" = "10.5.2"

      - name: Run pull request quality gate
        if: github.event_name == 'pull_request'
        run: corepack pnpm@10.5.2 run release:check

      - name: Build verified main release candidate
        if: github.event_name == 'push'
        run: corepack pnpm@10.5.2 run release:check -- --output-dir release-artifacts

      - name: Record main release candidate identity
        if: github.event_name == 'push'
        run: |
          node scripts/create-release-artifact.mjs \
            --tarball-dir release-artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/ci.yml" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA"

      - name: Retain verified main release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release-artifacts/*.tgz
            release-artifacts/SHA256SUMS
            release-artifacts/release-metadata.json
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30
