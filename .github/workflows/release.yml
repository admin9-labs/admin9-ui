name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve-candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ci-run-id: ${{ steps.candidate.outputs.run-id }}
      ci-run-attempt: ${{ steps.candidate.outputs.run-attempt }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Validate tag and main ancestry
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/check-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --checkout-head "$(git rev-parse HEAD)" \
            --main-head "$(git rev-parse origin/main)"

      - name: Revalidate remote release tag
        run: |
          node scripts/check-release.mjs \
            --remote-tag \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"

      - name: Resolve exact main CI candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/resolve-ci-candidate.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --workflow "ci.yml"

      - name: Download exact main CI candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run-id }}

      - name: Verify main CI candidate identity
        run: |
          node scripts/verify-release-artifact.mjs \
            --tarball-dir release-artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/ci.yml" \
            --run-id "${{ steps.candidate.outputs.run-id }}" \
            --run-attempt "${{ steps.candidate.outputs.run-attempt }}" \
            --commit "$GITHUB_SHA"

      - name: Retain promoted release tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: |
            release-artifacts/*.tgz
            release-artifacts/SHA256SUMS
            release-artifacts/release-metadata.json
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30

  publish-npm:
    needs: resolve-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download verified release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: release-artifacts

      - name: Set up trusted-publishing Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.19.0

      - name: Verify transferred tarball identity
        run: |
          node scripts/verify-release-artifact.mjs \
            --tarball-dir release-artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/ci.yml" \
            --run-id "${{ needs.resolve-candidate.outputs.ci-run-id }}" \
            --run-attempt "${{ needs.resolve-candidate.outputs.ci-run-attempt }}" \
            --commit "$GITHUB_SHA"

      - name: Revalidate remote tag before npm publication
        run: |
          node scripts/check-release.mjs \
            --remote-tag \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"

      - name: Check npm publication state
        id: registry
        run: node scripts/check-publish-status.mjs --tarball-dir release-artifacts >> "$GITHUB_OUTPUT"

      - name: Publish verified tarball to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish "./${{ steps.registry.outputs.tarball }}" --access public --provenance

      - name: Verify published package integrity
        run: node scripts/verify-published-integrity.mjs --tarball-dir release-artifacts

  verify-provenance:
    needs:
      - resolve-candidate
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download published release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: release-artifacts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify transferred tarball identity
        run: |
          node scripts/verify-release-artifact.mjs \
            --tarball-dir release-artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/ci.yml" \
            --run-id "${{ needs.resolve-candidate.outputs.ci-run-id }}" \
            --run-attempt "${{ needs.resolve-candidate.outputs.ci-run-attempt }}" \
            --commit "$GITHUB_SHA"

      - name: Verify published package and provenance
        run: |
          node scripts/verify-published-package.mjs \
            --tarball-dir release-artifacts \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/release.yml"

  github-release:
    needs:
      - resolve-candidate
      - verify-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download published release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: release-artifacts

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Verify transferred tarball identity
        run: |
          node scripts/verify-release-artifact.mjs \
            --tarball-dir release-artifacts \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/ci.yml" \
            --run-id "${{ needs.resolve-candidate.outputs.ci-run-id }}" \
            --run-attempt "${{ needs.resolve-candidate.outputs.ci-run-attempt }}" \
            --commit "$GITHUB_SHA"

      - name: Revalidate remote tag before GitHub Release
        run: |
          node scripts/check-release.mjs \
            --remote-tag \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"

      - name: Generate release notes from CHANGELOG
        run: node scripts/check-changelog.mjs --release "$GITHUB_REF_NAME" > release-notes.md

      - name: Check GitHub Release state
        id: github-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-github-release-status.mjs \
            --tarball-dir release-artifacts \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.github-release.outputs.disposition == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "./${{ steps.github-release.outputs.tarball }}" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "$GITHUB_REF_NAME"

      - name: Publish existing verified draft release
        if: steps.github-release.outputs.disposition == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --verify-tag

      - name: Verify GitHub Release asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-github-release-status.mjs \
            --tarball-dir release-artifacts \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md \
            --require-existing
