  <circle cx="432" cy="48" r="16" fill="#ff7d00"/>
  <circle cx="48" cy="432" r="16" fill="#00b42a"/>
  <circle cx="432" cy="432" r="16" fill="#165dff"/>
  <path d="M96 324 192 192l72 80 48-48 72 100Z" fill="#94bfff"/>
  <circle cx="324" cy="144" r="32" fill="#ffc96b"/>
  <text x="240" y="384" fill="#1d2129" font-family="sans-serif" font-size="32" text-anchor="middle">1:1</text>
